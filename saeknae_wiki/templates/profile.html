{% extends "base.html" %}
{% block title %}내 프로필 — 사내 Wiki{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-person-circle me-2 text-primary"></i>내 프로필
      </div>
      <div class="card-body">
        <p class="mb-1"><strong>아이디:</strong> {{ current_user.username }}</p>
        <p class="mb-3"><strong>이름:</strong> {{ current_user.display_name }}</p>
        <hr>
        <h6 class="fw-bold mb-3">비밀번호 변경</h6>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">현재 비밀번호</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">새 비밀번호 (4자 이상)</label>
            <input type="password" name="new_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">변경</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
