server {
    listen 80;
    server_name _;          # 도메인이 있으면 도메인명으로 변경 (예: wiki.mycompany.com)

    # 파일 업로드 최대 크기 (config.py의 MAX_CONTENT_LENGTH와 맞춤)
    client_max_body_size 50M;

    # 정적 파일 — Nginx가 직접 서빙 (Flask 우회, 속도 빠름)
    location /static/ {
        alias /opt/wiki/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 업로드 파일 — Nginx가 직접 서빙
    location /file/ {
        # 인증 없이 직접 접근 불가 — Flask 라우터를 통해서만 처리
        proxy_pass http://unix:/run/wiki/wiki.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지 모든 요청 → Gunicorn
    location / {
        proxy_pass http://unix:/run/wiki/wiki.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 (대용량 업로드 대비)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 보안 헤더
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection       "1; mode=block";

    # 로그
    access_log /var/log/nginx/wiki_access.log;
    error_log  /var/log/nginx/wiki_error.log;
}
