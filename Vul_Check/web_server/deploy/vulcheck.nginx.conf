server {
    listen 80;
    server_name _;   # 도메인 있으면 변경 (예: vulcheck.mycompany.com)

    # 에이전트 POST 최대 크기 (점검 항목 100개 기준 충분)
    client_max_body_size 5M;

    # 모든 요청 → Gunicorn
    location / {
        proxy_pass http://unix:/run/vulcheck/vulcheck.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 보안 헤더
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/vulcheck_access.log;
    error_log  /var/log/nginx/vulcheck_error.log;
}
